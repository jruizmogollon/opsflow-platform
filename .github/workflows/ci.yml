name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Restore
        run: dotnet restore OpsFlow.slnx
      - name: Build
        run: dotnet build OpsFlow.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test OpsFlow.slnx --configuration Release --no-build

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/OpsFlow.Dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/OpsFlow.Dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build dashboard
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/OpsFlow.Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
